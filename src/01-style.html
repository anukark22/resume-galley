<title>Resume Galley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,450;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">

<style>
/* ============================================================ tokens ===== */
:root{
  --bg:#F3F4F6; --panel:#FFFFFF; --panel-2:#F7F8F9; --panel-3:#EEF0F2;
  --ink:#17191D; --ink-2:#6B7078; --ink-3:#9AA0A8;
  --line:#E3E5E8; --line-2:#EDEEF1;
  --accent:#263B52; --accent-soft:#EAEEF3; --on-accent:#FFFFFF;
  --danger:#A8342C; --danger-soft:#FAEEED;
  --warn:#8A6212; --warn-soft:#FBF3E3;
  --ok:#2C6349;
  --radius:8px;
  --paper:#FFFFFF; --paper-ink:#17191D; --paper-ink-2:#5C626B; --paper-line:#DDE0E4;
  --page-edge:#DDE0E4;
  --shadow:0 1px 2px rgba(20,24,32,.05), 0 10px 30px -14px rgba(20,24,32,.22);
}

/* Dark is designed, not inverted: the canvas sinks, panels lift a step above
   it, and the accent moves to a pale ink blue that still reads on a dark
   ground. The paper stays white - it is paper - but its edge is dimmed so a
   full sheet does not glare against the surrounding dark. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1114; --panel:#17191D; --panel-2:#1C1F24; --panel-3:#23272D;
    --ink:#E8EAED; --ink-2:#9CA2AB; --ink-3:#848A93;
    --line:#262A30; --line-2:#1F2329;
    --accent:#8FB0D6; --accent-soft:#1A2029; --on-accent:#0F1114;
    --danger:#E2786E; --danger-soft:#2B1B19;
    --warn:#D3A85A; --warn-soft:#29211A;
    --ok:#6FB894;
    --page-edge:#3A3F46;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 34px -16px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1114; --panel:#17191D; --panel-2:#1C1F24; --panel-3:#23272D;
  --ink:#E8EAED; --ink-2:#9CA2AB; --ink-3:#848A93;
  --line:#262A30; --line-2:#1F2329;
  --accent:#8FB0D6; --accent-soft:#1A2029; --on-accent:#0F1114;
  --danger:#E2786E; --danger-soft:#2B1B19;
  --warn:#D3A85A; --warn-soft:#29211A;
  --ok:#6FB894;
  --page-edge:#3A3F46;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 34px -16px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:13.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-radius:3px}
::selection{background:var(--accent-soft); color:var(--ink)}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* meta: small uppercase technical labels */
.meta{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:9.5px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink-3);
}

/* ============================================================ shell ====== */
.app{height:100dvh; display:grid; grid-template-rows:54px 1fr; overflow:hidden}

.topbar{
  display:flex; align-items:center; gap:14px; padding:0 16px;
  background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:60;
}
.brand{display:flex; align-items:center; gap:9px; user-select:none}
.brand svg{width:19px; height:19px; color:var(--accent); flex:none}
.brand b{
  font-family:"Newsreader",Georgia,serif; font-weight:400; font-size:18px;
  letter-spacing:-.005em; white-space:nowrap;
}
.vr{width:1px; height:20px; background:var(--line); flex:none}
.topbar .grow{flex:1}

.docname{
  display:flex; flex-direction:column; align-items:flex-end; gap:1px; min-width:0; max-width:220px;
}
.docname b{
  font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; max-width:220px;
}
.savedot{display:flex; align-items:center; gap:5px; color:var(--ink-3); font-size:10.5px}
.savedot i{
  width:5px; height:5px; border-radius:50%; background:var(--ink-3); display:block;
  transition:background .3s;
}
.savedot.on i{background:var(--ok)}

/* ============================================================ buttons ==== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  height:30px; padding:0 11px; border-radius:6px; cursor:pointer; white-space:nowrap;
  font-size:12.5px; font-weight:450; color:var(--ink);
  background:transparent; border:1px solid transparent;
  transition:background .12s, border-color .12s, color .12s;
}
.btn:hover{background:var(--panel-3)}
.btn.outline{border-color:var(--line); background:var(--panel)}
.btn.outline:hover{background:var(--panel-2); border-color:var(--ink-3)}
.btn.primary{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.btn.icon{width:28px; height:28px; padding:0}
.btn.sm{height:26px; padding:0 9px; font-size:12px}
.btn[disabled]{opacity:.4; pointer-events:none}
.btn svg{width:14px; height:14px; flex:none; stroke-width:1.7}
.btn.icon svg{width:15px; height:15px}

/* ============================================================ menus ====== */
.menuwrap{position:relative}
.menu{
  position:absolute; top:calc(100% + 5px); right:0; min-width:190px; z-index:80;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); padding:4px; display:none;
}
.menu.open{display:block}
.menu.left{right:auto; left:0}
.menu button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none;
  border:0; padding:6px 8px; border-radius:5px; cursor:pointer; font-size:12.5px; color:var(--ink);
}
.menu button:hover{background:var(--panel-2)}
.menu button svg{width:14px; height:14px; color:var(--ink-2); flex:none; stroke-width:1.7}
.menu button small{margin-left:auto; color:var(--ink-3); font-size:10.5px}
.menu .sep{height:1px; background:var(--line-2); margin:4px 2px}
.menu .lbl{padding:6px 8px 4px}
.menu button.danger{color:var(--danger)}
.menu button.danger svg{color:var(--danger)}
.menu button.danger:hover{background:var(--danger-soft)}

/* ============================================================ layout ==== */
.work{display:grid; grid-template-columns:376px 1fr; overflow:hidden}
.rail{
  background:var(--panel); border-right:1px solid var(--line);
  overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column;
}
.tabs{
  display:flex; gap:20px; padding:0 18px; position:sticky; top:0; z-index:20;
  background:var(--panel); border-bottom:1px solid var(--line);
}
.tab{
  background:none; border:0; padding:13px 0 11px; cursor:pointer; position:relative;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-2);
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{
  content:""; position:absolute; left:0; right:0; bottom:-1px; height:1.5px; background:var(--accent);
}
.pane{padding:18px 18px 90px; display:none; flex-direction:column; gap:22px}
.pane.on{display:flex}

.group{display:flex; flex-direction:column; gap:2px}
.group > h3{
  margin:0 0 8px; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:9.5px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2); font-weight:500;
}
.grouphead{display:flex; align-items:baseline; gap:8px; margin:0 0 8px}
.grouphead h3{margin:0}
.grouphead .grow{flex:1}

/* ============================================================ fields ==== */
.f{display:flex; flex-direction:column; gap:3px; min-width:0; padding:7px 0}
.f + .f{border-top:1px solid var(--line-2)}
.f label{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:9px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-2);
}
.f input,.f textarea{
  width:100%; background:transparent; border:0; padding:1px 0; font-size:13px; color:var(--ink);
  border-radius:0;
}
.f textarea{resize:none; overflow:hidden; line-height:1.55; min-height:22px}
.f input:focus,.f textarea:focus{outline:none}
.f:focus-within label{color:var(--accent)}
.f input::placeholder,.f textarea::placeholder{color:var(--ink-3); opacity:.7}
.f.big input{font-size:17px; font-weight:500; letter-spacing:-.01em}
.f.head input{font-size:14px}
.frow{display:grid; grid-template-columns:1fr 1fr; gap:0 16px}
.frow .f + .f{border-top:1px solid var(--line-2)}
@media (max-width:480px){ .frow{grid-template-columns:1fr} }

/* boxed inputs, used only where a control needs an edge */
.box{
  background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 9px;
  font-size:13px; width:100%;
}
.box:focus{outline:none; border-color:var(--accent)}

/* ============================================================ sections == */
.seclist{display:flex; flex-direction:column}
.secrow{border-top:1px solid var(--line-2)}
.seclist > .secrow:first-child{border-top:0}
.sechead{
  display:flex; align-items:center; gap:8px; padding:9px 0; cursor:pointer; user-select:none;
}
.sechead .chev{
  width:13px; height:13px; color:var(--ink-3); flex:none; transition:transform .16s;
  stroke-width:2;
}
.secrow.open .sechead .chev{transform:rotate(90deg)}
.sectitle{flex:1; font-size:13px; font-weight:500; letter-spacing:-.005em; min-width:0}
.sectitle input{
  background:transparent; border:0; padding:0; font:inherit; color:inherit; width:100%;
}
.sectitle input:focus{outline:none; color:var(--accent)}
.seccount{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; color:var(--ink-3);
  flex:none; font-variant-numeric:tabular-nums;
}
.secrow.off .sectitle,.secrow.off .seccount{opacity:.45}
.secacts{display:flex; align-items:center; gap:1px; flex:none; opacity:0; transition:opacity .12s}
.secrow:hover .secacts,.secrow:focus-within .secacts{opacity:1}
.secacts .btn.icon{width:24px; height:24px}
.secacts .btn.icon svg{width:14px; height:14px}
.secbody{padding:0 0 12px; display:flex; flex-direction:column; gap:0}
.secrow:not(.open) .secbody{display:none}

/* entries: document objects, not cards */
.entry{border-top:1px solid var(--line-2)}
.entryhead{display:flex; align-items:flex-start; gap:10px; padding:9px 0; cursor:pointer}
.entryhead:hover{background:transparent}
.entryno{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10px; color:var(--ink-3);
  flex:none; width:16px; padding-top:2px; font-variant-numeric:tabular-nums;
}
.entrymain{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
.entrymain b{
  font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.entrymain b.empty{color:var(--ink-3); font-weight:400; font-style:italic}
.entrymain span{
  font-size:11.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.entrymain em{font-style:normal; color:var(--ink-3); font-size:11px}
.entryacts{display:flex; gap:1px; flex:none; opacity:0; transition:opacity .12s}
.entry:hover .entryacts,.entry:focus-within .entryacts{opacity:1}
.entryacts .btn.icon{width:24px; height:24px}
.entrybody{padding:2px 0 14px 26px; display:flex; flex-direction:column; gap:0}
.entry:not(.open) .entrybody{display:none}

/* bullets */
.bullets{display:flex; flex-direction:column; gap:0; padding-top:2px}
.bul{display:flex; align-items:flex-start; gap:8px; padding:4px 0}
.bul .dot{
  width:4px; height:4px; border-radius:50%; background:var(--ink-3); flex:none; margin-top:9px;
}
.bul textarea{
  flex:1; background:transparent; border:0; padding:0; font-size:13px; resize:none;
  overflow:hidden; line-height:1.55; min-height:20px;
}
.bul textarea:focus{outline:none}
.bul .btn.icon{width:22px; height:22px; opacity:0; transition:opacity .12s}
.bul:hover .btn.icon,.bul:focus-within .btn.icon{opacity:1}
.addrow{display:flex; gap:6px; padding-top:8px}
.addlink{
  display:inline-flex; align-items:center; gap:5px; background:none; border:0; padding:4px 0;
  cursor:pointer; font-size:12px; color:var(--ink-2);
}
.addlink:hover{color:var(--accent)}
.addlink svg{width:13px; height:13px; stroke-width:2}

.emptynote{padding:8px 0 4px; color:var(--ink-3); font-size:12px}

/* skills groups */
.skillgrp{border-top:1px solid var(--line-2); padding:10px 0; display:flex; flex-direction:column; gap:6px}
.skillgrp .top{display:flex; align-items:center; gap:8px}
.skillgrp .top input{
  flex:1; background:transparent; border:0; font-size:12.5px; font-weight:500; padding:0;
}
.skillgrp .top input:focus{outline:none; color:var(--accent)}
.skillgrp .btn.icon{width:22px; height:22px; opacity:0; transition:opacity .12s}
.skillgrp:hover .btn.icon{opacity:1}

/* ============================================================ canvas ==== */
.canvas{
  background:var(--bg); overflow:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column; align-items:center; padding:0 0 60px;
}
.doctools{
  position:sticky; top:0; z-index:15; align-self:stretch;
  display:flex; align-items:center; gap:10px; padding:11px 22px;
  background:var(--bg); border-bottom:1px solid transparent;
}
.doctools.stuck{border-bottom-color:var(--line)}
.docstat{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; color:var(--ink-2);
  display:flex; align-items:center; gap:7px; flex-wrap:wrap;
}
.docstat s{text-decoration:none; color:var(--ink-3)}
.docstat .warnflag{display:inline-flex; align-items:center; gap:5px; color:var(--warn)}
.docstat .warnflag i{width:5px; height:5px; border-radius:50%; background:var(--warn); display:block}
.doctools .grow{flex:1}
.zoom{display:flex; align-items:center; gap:2px}
.zoom .btn.icon{width:24px; height:24px}
.zoom .btn.icon svg{width:13px; height:13px}
.zoomval{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:10.5px; color:var(--ink-2);
  min-width:38px; text-align:center; font-variant-numeric:tabular-nums; cursor:pointer;
}

.pages{display:flex; flex-direction:column; align-items:center; gap:26px; transform-origin:top center}
.pagewrap{display:flex; flex-direction:column; gap:7px}
.pagelabel{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:9px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-2);
}
.page{
  background:var(--paper); color:var(--paper-ink); border:1px solid var(--page-edge);
  position:relative; overflow:hidden;
}
.page-inner{width:100%; height:100%; overflow:hidden}

/* ============================================================ resume ==== */
.page{
  --rs:1; --lead:1.42; --acc:#263B52;
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
  font-size:calc(10.5pt * var(--rs)); line-height:var(--lead);
}
.page[data-face="sans"]{font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif}
.page[data-face="serif"]{font-family:"Source Serif 4",Georgia,"Times New Roman",serif}
.page[data-face="times"]{font-family:"Times New Roman",Times,serif}

.r-head{margin-bottom:calc(13px * var(--rs))}
.r-name{
  font-size:calc(21pt * var(--rs)); line-height:1.08; font-weight:600; letter-spacing:-.015em;
  margin:0 0 2px; text-wrap:balance;
}
.r-headline{font-size:calc(10.5pt * var(--rs)); color:var(--paper-ink-2); margin:0 0 6px}
.r-contact{
  display:flex; flex-wrap:wrap; gap:0 calc(8px * var(--rs)); font-size:calc(9pt * var(--rs));
  color:var(--paper-ink-2); line-height:1.7;
}
.r-contact a{color:inherit; text-decoration:none}
.r-contact .sep{color:var(--paper-line)}

.r-sec{margin-top:calc(15px * var(--rs)); break-inside:avoid}
.r-sec:first-child{margin-top:0}
.r-sec-h{
  font-size:calc(9.5pt * var(--rs)); font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--acc); margin:0 0 calc(7px * var(--rs)); padding-bottom:calc(3px * var(--rs));
  border-bottom:1px solid var(--paper-line); break-after:avoid;
}
.r-item{margin-bottom:calc(10px * var(--rs)); break-inside:avoid}
.r-item:last-child{margin-bottom:0}
.r-item-top{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.r-role{font-weight:600; font-size:calc(10.8pt * var(--rs))}
.r-org{font-size:calc(10.2pt * var(--rs))}
.r-org .at{color:var(--paper-ink-2)}
.r-when{
  font-size:calc(8.8pt * var(--rs)); color:var(--paper-ink-2); white-space:nowrap; flex:none;
  font-variant-numeric:tabular-nums; overflow-wrap:normal;
}
.r-sub{font-size:calc(9.4pt * var(--rs)); color:var(--paper-ink-2)}
.r-sub a{color:inherit; text-decoration:none}
.r-bul{margin:calc(4px * var(--rs)) 0 0; padding-left:calc(13px * var(--rs)); list-style:none}
.r-bul li{position:relative; margin-bottom:calc(2.5px * var(--rs)); break-inside:avoid}
.r-bul li::before{
  content:""; position:absolute; left:calc(-9px * var(--rs)); top:calc(.62em);
  width:calc(2.6px * var(--rs)); height:calc(2.6px * var(--rs)); border-radius:50%;
  background:var(--paper-ink-2);
}
.r-text{margin:0; white-space:pre-wrap}
.r-skill{display:flex; gap:calc(8px * var(--rs)); margin-bottom:calc(4px * var(--rs)); align-items:baseline}
.r-skill b{font-weight:600; flex:none; min-width:calc(92px * var(--rs)); font-size:calc(9.8pt * var(--rs))}
.r-skill span{flex:1; color:var(--paper-ink-2)}

.page[data-tpl="classic"] .r-head{text-align:center}
.page[data-tpl="classic"] .r-contact{justify-content:center}
.page[data-tpl="classic"] .r-sec-h{
  text-align:center; color:var(--paper-ink); border-bottom:1px solid var(--paper-ink);
}
.page[data-tpl="modern"] .r-sec-h{border-bottom:1.6px solid var(--acc)}
.page[data-tpl="minimal"] .r-sec-h{
  border:none; color:var(--paper-ink-2); letter-spacing:.16em; padding-bottom:0;
  margin-bottom:calc(5px * var(--rs));
}
.page[data-tpl="rail"] .r-head,
.page[data-tpl="rail"] .r-sec{
  display:grid; grid-template-columns:19% 1fr; column-gap:calc(20px * var(--rs)); align-items:start;
}
.page[data-tpl="rail"] .r-head > *{grid-column:2}
.page[data-tpl="rail"] .r-sec-h{
  grid-column:1; margin:0; padding:0; border:none; text-align:left; color:var(--acc);
  font-size:calc(9pt * var(--rs)); letter-spacing:.12em; line-height:1.3; word-break:break-word;
}
.page[data-tpl="rail"] .r-sec-body{grid-column:2; min-width:0}

.r-empty{color:var(--ink-3); text-align:center; padding:60px 0; font-family:"IBM Plex Sans",sans-serif}
.r-empty b{display:block; font-size:14px; font-weight:500; color:var(--ink-2); margin-bottom:4px}
.r-empty span{font-size:12.5px}

/* ============================================================ report === */
#report{width:min(780px,100%); padding:6px 22px 0}
.rep{display:flex; flex-direction:column; gap:26px}
.rep-head{display:flex; align-items:center; gap:20px}
.rep-score{
  display:flex; flex-direction:column; align-items:center; justify-content:center; flex:none;
  width:96px; height:96px; border-radius:50%; border:2px solid var(--line); background:var(--panel);
}
.rep-score b{font-size:30px; font-weight:600; line-height:1; letter-spacing:-.02em}
.rep-score span{font-size:9.5px; color:var(--ink-2); margin-top:3px;
  font-family:"IBM Plex Mono",monospace; letter-spacing:.06em}
.rep-score.ok{border-color:var(--ok)} .rep-score.ok b{color:var(--ok)}
.rep-score.warn{border-color:var(--warn)} .rep-score.warn b{color:var(--warn)}
.rep-score.bad{border-color:var(--danger)} .rep-score.bad b{color:var(--danger)}
.rep-lead{flex:1; min-width:0}
.rep-lead .verdict{
  margin:0 0 9px; font-family:"Newsreader",Georgia,serif; font-size:19px; line-height:1.35;
  letter-spacing:-.01em; text-wrap:balance;
}
.rep-chips{display:flex; flex-wrap:wrap; gap:6px}
.repchip{
  font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  padding:4px 8px; border-radius:5px; background:var(--panel-3); color:var(--ink-2);
}
.repchip.ok{background:var(--accent-soft); color:var(--ok)}
.repchip.warn{background:var(--warn-soft); color:var(--warn)}
