/* ----------------------------------------------------------------- dates */
const MON = ["january","february","march","april","may","june","july",
             "august","september","october","november","december"];
const NOWISH = /^(present|current|currently|now|to date|ongoing|till date)$/i;

function parseDate(s) {
  const t = String(s || "").trim();
  if (!t) return null;
  let m = t.match(/^([A-Za-z]{3,9})\.?\s*,?\s*(\d{4})$/);
  if (m) {
    const i = MON.findIndex(x => x.startsWith(m[1].toLowerCase().slice(0, 3)));
    if (i >= 0) return { m: i, y: +m[2] };
  }
  m = t.match(/^(\d{1,2})[\/.\-](\d{4})$/);
  if (m && +m[1] >= 1 && +m[1] <= 12) return { m: +m[1] - 1, y: +m[2] };
  m = t.match(/^(\d{4})$/);
  if (m) return { m: -1, y: +m[1] };
  return null;
}
function fmtDate(s, style) {
  const t = String(s || "").trim();
  if (!t) return "";
  if (NOWISH.test(t)) return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
  const d = parseDate(t);
  if (!d) return t;
  if (d.m < 0) return String(d.y);
  if (style === "long") return MON[d.m].charAt(0).toUpperCase() + MON[d.m].slice(1) + " " + d.y;
  if (style === "numeric") return String(d.m + 1).padStart(2, "0") + "/" + d.y;
  return MON[d.m].slice(0, 3).charAt(0).toUpperCase() + MON[d.m].slice(1, 3) + " " + d.y;
}
function fmtRange(a, b, style) {
  const A = fmtDate(a, style), B = fmtDate(b, style);
  if (A && B) return A + " – " + B;
  return A || B;
}

/* ----------------------------------------------------------------- state */
const KEY = "resume-galley/v1";
const STORE = "resume-galley/files/v1";

function blankDoc() {
  return {
    v: 2,
    design: { tpl: "rail", face: "serif", accent: "#263B52", scale: 100,
              lead: 142, mg: 64, paper: "letter", dateFmt: "short", tplSet: false },
    header: { name: "", headline: "", email: "", phone: "", location: "", links: [] },
    sections: []
  };
}
function starterDoc() {
  const d = blankDoc();
  d.header = { name: "", headline: "", email: "", phone: "", location: "",
               links: [{ label: "LinkedIn", url: "" }, { label: "Portfolio", url: "" }] };
  d.sections = [
    { id: uid(), type: "summary", title: "Summary", on: true, _open: true, text: "" },
    { id: uid(), type: "experience", title: "Experience", on: true, _open: true,
      items: [{ id: uid(), _open: true, role: "", org: "", location: "", start: "", end: "", bullets: [""] }] },
    { id: uid(), type: "education", title: "Education", on: true, _open: false,
      items: [{ id: uid(), _open: false, degree: "", school: "", location: "", start: "", end: "", sub: "", bullets: [] }] },
    { id: uid(), type: "skills", title: "Skills", on: true, _open: false,
      groups: [{ id: uid(), label: "Languages", text: "" }] }
  ];
  return d;
}

let lib = loadLibrary();
let doc = migrate(activeEntry().doc);
let zoom = 0;                       /* 0 = fit to width */

function loadLibrary() {
  let raw = null;
  try { raw = localStorage.getItem(STORE); } catch (e) {}
  if (raw) {
    try {
      const l = JSON.parse(raw);
      if (l && Array.isArray(l.files) && l.files.length) {
        l.files.forEach(f => { f.id = f.id || uid(); f.doc = f.doc || blankDoc(); });
        if (!l.files.some(f => f.id === l.activeId)) l.activeId = l.files[0].id;
        return l;
      }
    } catch (e) {
      try { localStorage.setItem(STORE + "/unreadable", raw); } catch (e2) {}
    }
  }
  let old = null;
  try {
    const legacy = localStorage.getItem(KEY);
    if (legacy) { const d = JSON.parse(legacy); if (d && d.sections) old = d; }
  } catch (e) {}
  const first = { id: uid(), name: old ? "My resume" : "Untitled resume",
                  updated: Date.now(), doc: old || starterDoc() };
  return { activeId: first.id, files: [first] };
}
function activeEntry() { return lib.files.find(f => f.id === lib.activeId) || lib.files[0]; }
function firstVisit() {
  if (lib.greeted) return false;
  lib.greeted = true; save(true); return true;
}

function migrate(d) {
  const b = blankDoc();
  d.design = Object.assign(b.design, d.design || {});
  if (!d.design.dateFmt) d.design.dateFmt = "short";
  if (d.design.tpl === "rule") d.design.tpl = "minimal";
  d.header = Object.assign(b.header, d.header || {});
  d.header.links = d.header.links || [];
  d.sections = (d.sections || []).map(s => {
    s.id = s.id || uid();
    if (!TYPES[s.type]) s.type = "custom";
    if (s.on === undefined) s.on = true;
    const kind = TYPES[s.type].kind;
    if (kind === "items") s.items = (s.items || []).map(i => (i.id = i.id || uid(), i.bullets = i.bullets || [], i));
    if (kind === "groups") s.groups = (s.groups || []).map(g => (g.id = g.id || uid(), g));
    if (kind === "lines") s.lines = s.lines || [];
    if (kind === "text") s.text = s.text || "";
    return s;
  });
  return d;
}

let saveTimer = null;
function save(now) {
  clearTimeout(saveTimer);
  const go = () => {
    const f = activeEntry();
    if (f) { f.doc = doc; f.updated = Date.now(); }
    try { localStorage.setItem(STORE, JSON.stringify(lib)); flashSaved(true); }
    catch (e) { flashSaved(false, "Storage blocked"); }
  };
  now ? go() : (saveTimer = setTimeout(go, 450));
}
window.addEventListener("pagehide", () => save(true));
document.addEventListener("visibilitychange", () => { if (document.hidden) save(true); });

function flashSaved(ok, msg) {
  const dot = $("#saveDot"), txt = $("#saveText"), nm = $("#docName");
  const f = activeEntry();
  if (nm && f) nm.textContent = f.name || "Untitled resume";
  if (!dot) return;
  dot.classList.toggle("on", !!ok);
  if (txt) txt.textContent = msg || "Saved";
  if (ok) setTimeout(() => dot.classList.remove("on"), 1400);
}
function touch() { renderPreview(); save(); }

/* ------------------------------------------------------------ file ops */
function uniqueName(name) {
  const base = String(name || "").trim() || "Untitled resume";
  if (!lib.files.some(f => f.name === base)) return base;
  for (let i = 2; i < 99; i++) {
    const t = base + " (" + i + ")";
    if (!lib.files.some(f => f.name === t)) return t;
  }
  return base;
}
function openFile(id) {
  if (id === lib.activeId) return;
  save(true);
  const f = lib.files.find(x => x.id === id);
  if (!f) return;
  lib.activeId = id;
  doc = migrate(f.doc);
  save(true);
  renderAll();
}
function newFile(name, d) {
  save(true);
  const f = { id: uid(), name: uniqueName(name), updated: Date.now(), doc: d || starterDoc() };
  lib.files.unshift(f);
  lib.activeId = f.id;
  doc = migrate(f.doc);
  save(true); renderAll();
  return f;
}
function duplicateFile(id) {
  save(true);
  const f = lib.files.find(x => x.id === id);
  if (!f) return;
  const copy = { id: uid(), name: uniqueName(f.name + " copy"), updated: Date.now(),
                 doc: JSON.parse(JSON.stringify(f.doc)) };
  lib.files.splice(lib.files.indexOf(f) + 1, 0, copy);
  save(true); renderFiles();
}
function setActiveName(name) {
  const f = activeEntry();
  if (!f || !name) return;
  f.name = String(name).slice(0, 80);
  save(true); renderFiles();
}
function deleteFile(id) {
  const f = lib.files.find(x => x.id === id);
  if (!f) return;
  const snap = JSON.parse(JSON.stringify(lib));
  ask("Delete “" + f.name + "”?",
      "This resume will be removed from your saved resumes.", "Delete").then(yes => {
    if (!yes) return;
    lib.files.splice(lib.files.indexOf(f), 1);
    if (!lib.files.length) lib.files.push({ id: uid(), name: "Untitled resume", updated: Date.now(), doc: starterDoc() });
    if (!lib.files.some(x => x.id === lib.activeId)) {
      lib.activeId = lib.files[0].id;
      doc = migrate(lib.files[0].doc);
    }
    save(true); renderAll();
    const t = window.RG && window.RG.toast;
    if (t) t(f.name + " deleted", null, { label: "Undo", fn: () => {
      lib = snap; doc = migrate(activeEntry().doc); save(true); renderAll();
    } });
  });
}
function ago(ts) {
  if (!ts) return "not saved yet";
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 45) return "saved just now";
  if (s < 3600) return "saved " + Math.round(s / 60) + "m ago";
  if (s < 86400) return "saved " + Math.round(s / 3600) + "h ago";
  if (s < 172800) return "saved yesterday";
  return "saved " + new Date(ts).toLocaleDateString(undefined, { day: "numeric", month: "short" });
}

/* ============================================================ editor ==== */
function fieldHTML(f, val, path, extra) {
  const cls = "f" + (extra ? " " + extra : "");
  return '<div class="' + cls + '"><label for="' + path + '">' + esc(f.l) + "</label>" +
    '<input id="' + path + '" type="text" spellcheck="false" value="' + esc(val) +
    '" placeholder="' + esc(f.ph || "") + '" data-bind="' + path + '"></div>';
}
function areaHTML(label, val, path, ph) {
  return '<div class="f"><label for="' + path + '">' + esc(label) + "</label>" +
    '<textarea id="' + path + '" rows="2" data-bind="' + path + '" placeholder="' + esc(ph || "") +
    '">' + esc(val) + "</textarea></div>";
}
function bulletsHTML(label, arr, base, ph) {
  let h = '<div class="f"><label>' + esc(label) + "</label><div class=\"bullets\">";
  if (!arr.length) h += '<div class="emptynote">Nothing here yet</div>';
  arr.forEach((b, i) => {
    h += '<div class="bul"><span class="dot"></span>' +
      '<textarea rows="1" data-bind="' + base + "." + i + '" placeholder="' + esc(ph || "") + '">' +
      esc(b) + "</textarea>" +
      '<button class="btn icon" data-act="bul-del" data-p="' + base + '" data-i="' + i +
      '" aria-label="Delete point">' + ICON.x + "</button></div>";
  });
  h += "</div>" +
    '<button class="addlink" data-act="bul-add" data-p="' + base + '">' + ICON.plus + " Add point</button></div>";
  return h;
}

function linkSlot(label, ph) {
  let i = doc.header.links.findIndex(l => (l.label || "").toLowerCase() === label.toLowerCase());
  if (i < 0) { doc.header.links.push({ label: label, url: "" }); i = doc.header.links.length - 1; }
  return { i: i, url: doc.header.links[i].url || "", ph: ph };
}

function renderEditor() {
  const pane = $("#pane-content");
  const hd = doc.header;
  const li = linkSlot("LinkedIn", "linkedin.com/in/you");
  const po = linkSlot("Portfolio", "yoursite.com");
  const extra = doc.header.links
    .map((l, i) => ({ l: l, i: i }))
    .filter(x => x.i !== li.i && x.i !== po.i);

  let h = "";

  /* --- identity --- */
  h += '<section class="group"><h3>Personal information</h3>';
  h += fieldHTML({ l: "Full name", ph: "Anuka Rashmi Kumar" }, hd.name, "header.name", "big");
  h += fieldHTML({ l: "Professional headline", ph: "Electronics engineer" }, hd.headline, "header.headline", "head");
  h += '<div class="frow">' +
    fieldHTML({ l: "Email", ph: "you@email.com" }, hd.email, "header.email") +
    fieldHTML({ l: "Phone", ph: "+91 91086 32452" }, hd.phone, "header.phone") + "</div>";
  h += fieldHTML({ l: "Location", ph: "Bengaluru, India" }, hd.location, "header.location");
  h += fieldHTML({ l: "LinkedIn", ph: li.ph }, li.url, "header.links." + li.i + ".url");
  h += fieldHTML({ l: "Portfolio", ph: po.ph }, po.url, "header.links." + po.i + ".url");
  extra.forEach(x => {
    h += '<div class="f"><label>' + esc(x.l.label || "Link") + "</label>" +
      '<div style="display:flex;gap:8px;align-items:center">' +
      '<input type="text" style="flex:0 0 30%" value="' + esc(x.l.label) +
      '" placeholder="Label" data-bind="header.links.' + x.i + '.label">' +
      '<input type="text" style="flex:1" value="' + esc(x.l.url) +
      '" placeholder="link" data-bind="header.links.' + x.i + '.url">' +
      '<button class="btn icon" data-act="link-del" data-i="' + x.i + '" aria-label="Remove link">' +
      ICON.x + "</button></div></div>";
  });
  h += '<button class="addlink" data-act="link-add">' + ICON.plus + " Add another link</button>";
  h += "</section>";

  /* --- sections --- */
  h += '<section class="group"><div class="grouphead"><h3>Resume sections</h3><span class="grow"></span></div>';
  h += '<div class="seclist">';
  doc.sections.forEach((sec, si) => {
    const t = TYPES[sec.type];
    const n = t.kind === "items" ? sec.items.length
            : t.kind === "groups" ? sec.groups.length
            : t.kind === "lines" ? sec.lines.length : 0;
    h += '<div class="secrow' + (sec._open ? " open" : "") + (sec.on ? "" : " off") + '">' +
      '<div class="sechead" data-act="fold" data-s="' + si + '">' +
        '<span class="chev">' + ICON.chev + "</span>" +
        '<span class="sectitle"><input value="' + esc(sec.title) +
          '" data-bind="sections.' + si + '.title" aria-label="Section name" spellcheck="false"></span>' +
        (t.kind === "text" ? "" : '<span class="seccount">' + n + "</span>") +
        '<span class="secacts">' +
          '<button class="btn icon" data-act="sec-vis" data-s="' + si + '" aria-label="' +
            (sec.on ? "Hide section" : "Show section") + '" title="' +
            (sec.on ? "Hide from resume" : "Show on resume") + '">' + (sec.on ? ICON.eye : ICON.eyeOff) + "</button>" +
          '<span class="menuwrap">' +
            '<button class="btn icon" data-act="sec-menu" data-s="' + si + '" aria-label="More">' + ICON.more + "</button>" +
            '<div class="menu" data-menu="sec-' + si + '">' +
              '<button data-act="sec-rename" data-s="' + si + '">' + ICON.pencil + " Rename</button>" +
              '<button data-act="sec-vis" data-s="' + si + '">' + (sec.on ? ICON.eyeOff + " Hide" : ICON.eye + " Show") + "</button>" +
              '<button data-act="sec-up" data-s="' + si + '">' + ICON.up + " Move up</button>" +
              '<button data-act="sec-down" data-s="' + si + '">' + ICON.down + " Move down</button>" +
              '<div class="sep"></div>' +
              '<button class="danger" data-act="sec-del" data-s="' + si + '">' + ICON.trash + " Delete</button>" +
            "</div>" +
          "</span>" +
        "</span>" +
      "</div>";

    h += '<div class="secbody">';
    if (t.kind === "text") {
      h += areaHTML("Text", sec.text, "sections." + si + ".text", t.ph);
    }
    if (t.kind === "lines") {
      h += bulletsHTML("Items", sec.lines, "sections." + si + ".lines", t.bulPh);
    }
    if (t.kind === "groups") {
      sec.groups.forEach((g, gi) => {
        h += '<div class="skillgrp"><div class="top">' +
          '<input value="' + esc(g.label) + '" placeholder="Group name" data-bind="sections.' + si + ".groups." + gi + '.label">' +
          '<button class="btn icon" data-act="grp-del" data-s="' + si + '" data-i="' + gi + '" aria-label="Remove group">' + ICON.x + "</button>" +
          "</div>" +
          '<textarea rows="1" class="box" style="font-size:12.5px" data-bind="sections.' + si + ".groups." + gi +
            '.text" placeholder="Python, C, Embedded C">' + esc(g.text) + "</textarea></div>";
      });
      h += '<button class="addlink" data-act="grp-add" data-s="' + si + '">' + ICON.plus + " " + esc(t.add) + "</button>";
    }
    if (t.kind === "items") {
      sec.items.forEach((it, ii) => {
        h += '<div class="entry' + (it._open ? " open" : "") + '">' +
          '<div class="entryhead" data-act="fold-item" data-s="' + si + '" data-i="' + ii + '">' +
            '<span class="entryno">' + String(ii + 1).padStart(2, "0") + "</span>" +
            '<span class="entrymain">' + entryLines(sec, it) + "</span>" +
            '<span class="entryacts">' +
              '<button class="btn icon" data-act="item-up" data-s="' + si + '" data-i="' + ii + '" aria-label="Move up">' + ICON.up + "</button>" +
              '<button class="btn icon" data-act="item-down" data-s="' + si + '" data-i="' + ii + '" aria-label="Move down">' + ICON.down + "</button>" +
              '<button class="btn icon" data-act="item-del" data-s="' + si + '" data-i="' + ii + '" aria-label="Delete entry">' + ICON.trash + "</button>" +
            "</span>" +
          "</div><div class=\"entrybody\">";
        const base = "sections." + si + ".items." + ii;
        const halves = [];
        t.fields.forEach(f => {
          if (f.w === "half") { halves.push(fieldHTML(f, it[f.k], base + "." + f.k)); return; }
          if (halves.length) { h += '<div class="frow">' + halves.join("") + "</div>"; halves.length = 0; }
          h += fieldHTML(f, it[f.k], base + "." + f.k);
        });
        if (halves.length) h += '<div class="frow">' + halves.join("") + "</div>";
        h += bulletsHTML(t.bul, it.bullets, base + ".bullets", t.bulPh);
        h += "</div></div>";
      });
      h += '<button class="addlink" data-act="item-add" data-s="' + si + '">' + ICON.plus + " " + esc(t.add) + "</button>";
    }
    h += "</div></div>";
  });
  h += "</div>";
  h += '<button class="addlink" data-act="sec-add" style="margin-top:10px">' + ICON.plus + " Add section</button>";
  h += "</section>";

  pane.innerHTML = h;
  $$("textarea", pane).forEach(autosize);
}

function entryLines(sec, it) {
  const t = TYPES[sec.type];
  const a = (it[t.primary] || "").trim();
  const b = (it[t.org] || "").trim();
  const meta = t.meta ? (it[t.meta] || "").trim() : "";
  const when = t.single ? fmtDate(it[t.single], doc.design.dateFmt)
                        : fmtRange(it.start, it.end, doc.design.dateFmt);
  const line3 = [meta, when].filter(Boolean).join(" · ");
  let h = a ? "<b>" + esc(a) + "</b>" : '<b class="empty">Untitled entry</b>';
  if (b) h += "<span>" + esc(b) + "</span>";
  if (line3) h += "<em>" + esc(line3) + "</em>";
  return h;
}

function autosize(ta) {
  ta.style.height = "auto";
  ta.style.height = Math.max(20, ta.scrollHeight) + "px";
}

/* ------------------------------------------------------------ path bind */
function getPath(p) { return p.split(".").reduce((o, k) => (o == null ? o : o[k]), doc); }
function setPath(p, v) {
  const parts = p.split(".");
  const last = parts.pop();
  parts.reduce((o, k) => o[k], doc)[last] = v;
}

/* ============================================================ preview === */
const PAPER = { letter: { w: 816, h: 1056 }, a4: { w: 794, h: 1123 } };

function contactBits() {
  const hd = doc.header, out = [];
  if (hd.email) out.push('<a href="mailto:' + esc(hd.email) + '">' + esc(hd.email) + "</a>");
  if (hd.phone) out.push(esc(hd.phone));
  if (hd.location) out.push(esc(hd.location));
  (hd.links || []).forEach(l => {
    const url = (l.url || "").trim();
    if (!url) return;
    const href = /^https?:/i.test(url) ? url : "https://" + url;
    out.push('<a href="' + esc(href) + '" rel="noreferrer">' + esc(l.label || url) + "</a>");
  });
  return out;
}
function headHTML() {
  const hd = doc.header, bits = contactBits();
  if (!hd.name && !hd.headline && !bits.length) return "";
  let h = '<div class="r-head">';
  if (hd.name) h += '<h1 class="r-name">' + esc(hd.name) + "</h1>";
  if (hd.headline) h += '<p class="r-headline">' + esc(hd.headline) + "</p>";
  if (bits.length) h += '<div class="r-contact">' + bits.join('<span class="sep">&nbsp;&middot;&nbsp;</span>') + "</div>";
  return h + "</div>";
}
function looksLikeUrl(s) {
  return /^(https?:\/\/|www\.)/i.test(s) || /^[\w-]+(\.[\w-]+)+(\/|$)/.test(s);
}
function linkHTML(s) {
  const t = String(s).trim();
  const href = /^https?:/i.test(t) ? t : "https://" + t;
  return '<a href="' + esc(href) + '" rel="noreferrer">' + esc(t.replace(/^https?:\/\//i, "")) + "</a>";
}

function itemHTML(sec, it) {
  const t = TYPES[sec.type], f = doc.design.dateFmt;
  const title = (it[t.primary] || "").trim();
  const org = (it[t.org] || "").trim();
  const meta = t.meta ? (it[t.meta] || "").trim() : "";
  const when = t.single ? fmtDate(it[t.single], f) : fmtRange(it.start, it.end, f);
  const sub = (it.sub || "").trim();
  const buls = (it.bullets || []).filter(b => b && b.trim());
  if (!title && !org && !when && !buls.length) return "";
  let h = '<div class="r-item"><div class="r-item-top"><div>';
  if (title) h += '<span class="r-role">' + esc(title) + "</span>";
  if (title && org) h += '<span class="r-org"><span class="at"> — </span>' + esc(org) + "</span>";
  else if (org) h += '<span class="r-org">' + esc(org) + "</span>";
  h += "</div>";
  if (when) h += '<div class="r-when">' + esc(when) + "</div>";
  h += "</div>";
  /* a credential or project address is worth clicking in the exported PDF */
  const bits = [];
  if (sub) bits.push(esc(sub));
  if (meta) bits.push(t.meta === "link" || looksLikeUrl(meta) ? linkHTML(meta) : esc(meta));
  if (bits.length) h += '<div class="r-sub">' + bits.join(" · ") + "</div>";
  if (buls.length) h += '<ul class="r-bul">' + buls.map(b => "<li>" + esc(b.trim()) + "</li>").join("") + "</ul>";
  return h + "</div>";
}

/* every section becomes a heading plus a list of independently placeable parts */
function buildBlocks() {
  const out = [];
  const head = headHTML();
  if (head) out.push({ kind: "head", html: head });
  doc.sections.forEach(sec => {
    if (!sec.on) return;
    const t = TYPES[sec.type];
    let parts = [];
    if (t.kind === "text") {
      const v = (sec.text || "").trim();
      if (v) parts = ['<p class="r-text">' + esc(v) + "</p>"];
    } else if (t.kind === "items") {
      parts = sec.items.map(it => itemHTML(sec, it)).filter(Boolean);
    } else if (t.kind === "groups") {
      parts = sec.groups.map(g => {
        const l = (g.label || "").trim(), x = (g.text || "").trim();
        if (!l && !x) return "";
        return '<div class="r-skill">' + (l ? "<b>" + esc(l) + "</b>" : "") +
               "<span>" + esc(x) + "</span></div>";
      }).filter(Boolean);
    } else if (t.kind === "lines") {
      const ls = (sec.lines || []).filter(l => l && l.trim());
      if (ls.length) parts = ['<ul class="r-bul">' + ls.map(l => "<li>" + esc(l.trim()) + "</li>").join("") + "</ul>"];
    }
    if (parts.length) out.push({ kind: "sec", title: sec.title, parts: parts });
  });
  return out;
}

function secOpen(title, cont) {
  const railHead = doc.design.tpl === "rail";
  return '<section class="r-sec' + (cont ? " cont" : "") + '">' +
    (cont ? (railHead ? '<h2 class="r-sec-h"></h2>' : "") : '<h2 class="r-sec-h">' + esc(title) + "</h2>") +
    '<div class="r-sec-body">';
}

function renderPreview() {
  const d = doc.design;
  const paper = PAPER[d.paper] || PAPER.letter;
  const inner = paper.w - d.mg * 2;
  const blocks = buildBlocks();

  const mm = $("#measure");
  mm.className = "page";
  mm.dataset.tpl = d.tpl; mm.dataset.face = d.face;
  mm.style.cssText = "position:absolute;left:-10000px;top:0;visibility:hidden;" +
    "width:" + inner + "px;height:auto;border:0;";
  mm.style.setProperty("--rs", (d.scale / 100).toFixed(3));
  mm.style.setProperty("--lead", (d.lead / 100).toFixed(2));
  mm.style.setProperty("--acc", d.accent);

  /* one reflow: lay everything out, then read every height */
  let mh = "";
  blocks.forEach((b, bi) => {
    if (b.kind === "head") { mh += '<div data-m="h' + bi + '">' + b.html + "</div>"; return; }
    mh += secOpen(b.title, false).replace('<h2 class="r-sec-h">', '<h2 class="r-sec-h" data-m="t' + bi + '">');
    b.parts.forEach((p, pi) => { mh += '<div data-m="p' + bi + "_" + pi + '">' + p + "</div>"; });
    mh += "</div></section>";
  });
  mm.innerHTML = mh;

  const H = {};
  $$("[data-m]", mm).forEach(el => {
    const cs = getComputedStyle(el);
    H[el.dataset.m] = el.offsetHeight + (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0);
  });
  const secGap = parseFloat(getComputedStyle(mm.querySelector(".r-sec") || mm).marginTop) || 0;
  mm.innerHTML = "";

  /* distribute into pages, keeping a heading with its first entry */
  const usable = Math.max(200, paper.h - d.mg * 2);
  const pages = [];
  let cur = "", y = 0;
  const newPage = () => { pages.push(cur); cur = ""; y = 0; };

  blocks.forEach((b, bi) => {
    if (b.kind === "head") { cur += b.html; y += H["h" + bi] || 0; return; }

    const hh = (H["t" + bi] || 0) + (pages.length || cur ? secGap : 0);
    const h0 = H["p" + bi + "_0"] || 0;
    /* a heading may not sit at the foot of a page without its first entry */
    if (y > 0 && y + hh + h0 > usable) newPage();

    cur += secOpen(b.title, false);
    y += hh;
    let openSec = true;

    b.parts.forEach((p, pi) => {
      const ph = H["p" + bi + "_" + pi] || 0;
      if (y + ph > usable && y > 0 && ph <= usable) {
        cur += "</div></section>";
        openSec = false;
        newPage();
        cur += secOpen(b.title, true);
        openSec = true;
      }
      cur += p;
      y += ph;
    });
    if (openSec) cur += "</div></section>";
  });
  pages.push(cur);

  const host = $("#pages");
  const any = blocks.length > 0;
  host.innerHTML = !any
    ? '<div class="pagewrap"><div class="page" style="width:' + paper.w + "px;height:" + paper.h +
      'px"><div class="page-inner" style="padding:' + d.mg + 'px"><div class="r-empty">' +
      "<b>Your resume appears here</b><span>Import the one you already have, or start typing.</span>" +
      "</div></div></div></div>"
    : pages.map((p, i) =>
        '<div class="pagewrap"><div class="pagelabel">Page ' + (i + 1) + "</div>" +
        '<div class="page" data-tpl="' + d.tpl + '" data-face="' + d.face + '" style="width:' + paper.w +
        "px;height:" + paper.h + "px;--rs:" + (d.scale / 100).toFixed(3) + ";--lead:" +
        (d.lead / 100).toFixed(2) + ";--acc:" + d.accent + '">' +
        '<div class="page-inner" style="padding:' + d.mg + 'px">' + p + "</div></div></div>"
      ).join("");

  const n = any ? pages.length : 1;
  const lastFill = any ? Math.min(100, Math.max(1, Math.round((y / usable) * 100))) : 0;
  const stat = $("#docStat");
  stat.innerHTML =
    "<span>" + n + " page" + (n > 1 ? "s" : "") + "</span><s>&middot;</s>" +
    "<span>" + (d.paper === "a4" ? "A4" : "US Letter") + "</span>" +
    /* on one page that reads as the whole resume; on more, say which page it is */
    (any ? "<s>&middot;</s><span>" + (n === 1 ? lastFill + "% filled"
                                              : "page " + n + " is " + lastFill + "% full") + "</span>" : "") +
    (n > 2 ? '<s>&middot;</s><span class="warnflag"><i></i>Consider shortening</span>' : "");

  fit();
  save();
}

function fit() {
  const canvas = $("#canvas"), host = $("#pages");
  if (!canvas || !host) return;
  const paper = PAPER[doc.design.paper] || PAPER.letter;
  const avail = canvas.clientWidth - 56;
  const k = zoom ? zoom / 100 : Math.min(1, avail / paper.w);
  host.style.transform = "scale(" + k + ")";
  host.style.width = paper.w + "px";
  host.style.margin = "0";
  const natural = host.scrollHeight;
  /* a transform does not change layout size, so the unscaled width would keep
     forcing a sideways scrollbar - take the difference back in the margins */
  const dx = (paper.w * k - paper.w) / 2;
  host.style.marginLeft = dx + "px";
  host.style.marginRight = dx + "px";
  host.style.marginBottom = (natural * k - natural) + "px";
  const zv = $("#zoomVal");
  if (zv) zv.textContent = Math.round(k * 100) + "%";
}
function setZoom(v) { zoom = v; fit(); }

/* ============================================================ design === */
function thumb(kind) {
  const bar = '<i style="width:100%"></i>';
  if (kind === "rail") {
    return '<div class="thumb"><div class="row"><div class="side"><i style="width:80%;background:var(--accent);height:2.5px"></i></div>' +
      '<div class="col"><i class="hd"></i>' + bar + bar + '<i style="width:70%"></i></div></div>' +
      '<div class="row" style="margin-top:4px"><div class="side"><i style="width:60%;background:var(--accent);height:2.5px"></i></div>' +
      '<div class="col">' + bar + '<i style="width:80%"></i></div></div></div>';
  }
  if (kind === "modern") {
    return '<div class="thumb"><i class="hd"></i><div class="rule"></div>' + bar + bar +
      '<i style="width:64%"></i><div class="rule" style="margin-top:3px"></div>' + bar + "</div>";
  }
  if (kind === "classic") {
    return '<div class="thumb center"><i class="hd" style="width:46%"></i>' +
      '<i style="width:70%;height:1.5px"></i><i style="width:34%;background:#7C838C;height:2px;margin-top:2px"></i>' +
      bar + bar + '<i style="width:82%"></i></div>';
  }
  return '<div class="thumb"><i class="hd"></i><i style="width:26%;background:#9AA0A8;height:2px;margin-top:3px"></i>' +
    bar + bar + '<i style="width:58%"></i><i style="width:26%;background:#9AA0A8;height:2px;margin-top:3px"></i>' + bar + "</div>";
}

  const faces = [["serif", "Source Serif", "'Source Serif 4',Georgia,serif"],
                 ["sans", "Plex Sans", "'IBM Plex Sans',sans-serif"],
                 ["times", "Times", "'Times New Roman',Times,serif"]];
  const name = (doc.header.name || "Anuka Rashmi Kumar").split(/\s+/).slice(0, 2).join(" ");

  h += '<section class="group"><h3>Resume layout</h3><div class="tplgrid">' +

      '<button class="tplopt" data-tpl="' + t[0] + '" aria-pressed="' + (d.tpl === t[0]) + '">' +
      thumb(t[0]) + "<b>" + t[1] + "</b><small>" + t[2] + "</small></button>").join("") +

      '" title="' + a[1] + '" aria-label="' + a[1] + '" aria-pressed="' + (d.accent === a[0]) + '"></button>').join("") +
    "</div></section>";

  h += '<section class="group"><h3>Formatting</h3>' +
    ctl("Text size", d.scale + "%", "scale", 82, 118, 2, d.scale) +
    ctl("Line spacing", (d.lead / 100).toFixed(2), "lead", 120, 175, 2, d.lead) +
    ctl("Page margin", (d.mg / 96).toFixed(2) + " in", "mg", 40, 96, 4, d.mg) +
    "</section>";

  h += '<section class="group"><h3>Document</h3>' +
    '<div class="ctl"><div class="top"><label>Paper size</label></div><div class="segline" data-set="paper">' +

      '<button data-v="a4" aria-pressed="' + (d.paper === "a4") + '">A4</button></div></div>' +
    '<div class="ctl"><div class="top"><label>Date format</label></div><div class="segline" data-set="dateFmt">' +
      '<button data-v="short" aria-pressed="' + (d.dateFmt === "short") + '">Jan 2025</button>' +
      '<button data-v="long" aria-pressed="' + (d.dateFmt === "long") + '">January 2025</button>' +
      '<button data-v="numeric" aria-pressed="' + (d.dateFmt === "numeric") + '">01/2025</button></div></div>' +
    "</section>";

  $("#pane-design").innerHTML = h;
}
function ctl(label, val, key, min, max, step, now) {
  return '<div class="ctl"><div class="top"><label>' + label + "</label><b>" + val + "</b></div>" +
    '<input type="range" data-rng="' + key + '" min="' + min + '" max="' + max + '" step="' + step +
    '" value="' + now + '"></div>';
}

/* ============================================================ files ==== */

let canvasMode = "paper";
function setCanvasMode(m) {
  canvasMode = m;

function renderAll() {
  renderEditor(); renderDesign(); renderFiles(); renderPreview();

/* ============================================================ events === */
document.addEventListener("input", e => {
  const el = e.target, bind = el.dataset && el.dataset.bind;
  if (!bind) {
    if (el.id === "fileName") { setActiveName(el.value); $("#docName").textContent = el.value || "Untitled resume"; }
    return;
  }
  setPath(bind, el.value);
  if (el.tagName === "TEXTAREA") autosize(el);
  const entry = el.closest(".entry");
  const m = bind.match(/^sections\.(\d+)\.items\.(\d+)\./);
  if (entry && m) {
    const head = $(".entrymain", entry);
    if (head) head.innerHTML = entryLines(doc.sections[+m[1]], doc.sections[+m[1]].items[+m[2]]);
  }
  touch();
});

const pane = $("#pane-content");

pane.addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const si = +btn.dataset.s, ii = +btn.dataset.i;
  const sec = doc.sections[si];

  if (act === "sec-menu") {
    e.stopPropagation();
    const m = $('[data-menu="sec-' + si + '"]', pane);
    const wasOpen = m && m.classList.contains("open");
    $$(".menu.open").forEach(x => x.classList.remove("open"));
    if (m && !wasOpen) m.classList.add("open");
    return;
  }
  if (act === "fold") {
    if (e.target.closest("input") || e.target.closest("button")) return;
    sec._open = !sec._open; renderEditor(); save(); return;
  }
  if (act === "fold-item") {
    if (e.target.closest("button")) return;
    sec.items[ii]._open = !sec.items[ii]._open; renderEditor(); save(); return;
  }
  if (act === "sec-rename") {
    $$(".menu.open").forEach(x => x.classList.remove("open"));
    const inp = $('[data-bind="sections.' + si + '.title"]', pane);
    if (inp) { inp.focus(); inp.select(); }
    return;
  }

  const ops = {
    "link-add":  () => { doc.header.links.push({ label: "Link", url: "" });
                         return "header.links." + (doc.header.links.length - 1) + ".url"; },
    "link-del":  () => doc.header.links.splice(ii, 1),
    "sec-vis":   () => { sec.on = !sec.on; },
    "sec-up":    () => move(doc.sections, si, -1),
    "sec-down":  () => move(doc.sections, si, 1),
    "sec-del":   () => { askRemove({
                     empty: !sectionFilled(sec),
                     title: "Delete “" + sec.title + "”?",
                     body: "This section and everything in it will be removed.",
                     done: "Section deleted",
                     remove: () => { const i = doc.sections.indexOf(sec); if (i > -1) doc.sections.splice(i, 1); }
                   }); return "skip"; },
    "sec-add":   () => { openAdd(); return "skip"; },
    "item-add":  () => { sec.items.push(newItem(sec.type));
                         return "sections." + si + ".items." + (sec.items.length - 1) + "." + TYPES[sec.type].fields[0].k; },
    "item-del":  () => { const it = sec.items[ii];
                   askRemove({
                     empty: !itemFilled(sec, it),
                     title: "Delete this entry?",
                     body: ((it[TYPES[sec.type].primary] || "").trim() || "This entry") + " will be removed.",
                     done: "Entry deleted",
                     remove: () => { const i = sec.items.indexOf(it); if (i > -1) sec.items.splice(i, 1); }
                   }); return "skip"; },
    "item-up":   () => move(sec.items, ii, -1),
    "item-down": () => move(sec.items, ii, 1),
    "grp-add":   () => { sec.groups.push({ id: uid(), label: "", text: "" });
                         return "sections." + si + ".groups." + (sec.groups.length - 1) + ".label"; },
    "grp-del":   () => { const g = sec.groups[ii];
                   askRemove({
                     empty: !((g.label || "").trim() || (g.text || "").trim()),
                     title: "Delete this group?",
                     body: ((g.label || "").trim() || "This group") + " will be removed.",
                     done: "Group deleted",
                     remove: () => { const i = sec.groups.indexOf(g); if (i > -1) sec.groups.splice(i, 1); }
                   }); return "skip"; },
    "bul-add":   () => { const p = btn.dataset.p, a = getPath(p); a.push("");
                         return p + "." + (a.length - 1); },
    "bul-del":   () => { const arr = getPath(btn.dataset.p), txt = (arr[ii] || "").trim();
                   askRemove({
                     empty: !txt, title: "Delete this point?",
                     body: "“" + (txt.length > 90 ? txt.slice(0, 90) + "…" : txt) + "”",
                     done: "Point deleted", remove: () => arr.splice(ii, 1)
                   }); return "skip"; }
  };
  if (!ops[act]) return;
  const focusPath = ops[act]();
  if (focusPath === "skip") return;
  $$(".menu.open").forEach(x => x.classList.remove("open"));
  renderEditor(); renderPreview(); save(true);
  focusField(focusPath);
});

function focusField(path) {
  if (typeof path !== "string" || !path) return;
  const el = $('[data-bind="' + path + '"]');
  if (!el) return;
  el.focus({ preventScroll: true });
  el.scrollIntoView({ block: "nearest" });
}
function firstFieldPath(si) {
  const s = doc.sections[si], t = TYPES[s.type];
  if (t.kind === "items") return "sections." + si + ".items.0." + t.fields[0].k;
  if (t.kind === "groups") return "sections." + si + ".groups.0.label";
  if (t.kind === "lines") return "sections." + si + ".lines.0";
  return "sections." + si + ".text";
}
function move(arr, i, d) {
  const j = i + d;
  if (j < 0 || j >= arr.length) return;
  arr.splice(j, 0, arr.splice(i, 1)[0]);
}
function newItem(type) {
  const t = TYPES[type], o = { id: uid(), _open: true, bullets: [] };
  (t.fields || []).forEach(f => (o[f.k] = ""));
  return o;
}
function newSection(type) {
  const t = TYPES[type];
  const s = { id: uid(), type: type, title: t.name, on: true, _open: true };
  if (t.kind === "items") s.items = [newItem(type)];
  if (t.kind === "groups") s.groups = [{ id: uid(), label: "", text: "" }];
  if (t.kind === "lines") s.lines = [""];
  if (t.kind === "text") s.text = "";
  return s;
}
function itemFilled(sec, it) {
  const t = TYPES[sec.type];
  if ((it.bullets || []).some(b => (b || "").trim())) return true;
  return (t.fields || []).some(f => (it[f.k] || "").trim());
}
function sectionFilled(s) {
  const t = TYPES[s.type];
  if (t.kind === "text") return !!(s.text || "").trim();
  if (t.kind === "lines") return (s.lines || []).some(l => (l || "").trim());
  if (t.kind === "groups") return (s.groups || []).some(g => (g.label || "").trim() || (g.text || "").trim());
  return (s.items || []).some(it => itemFilled(s, it));
}
function askRemove(o) {
  const snap = JSON.parse(JSON.stringify(doc));
  const go = () => {
    o.remove();
    $$(".menu.open").forEach(x => x.classList.remove("open"));
    renderEditor(); renderPreview(); save(true);
    const t = window.RG && window.RG.toast;
    if (t) t(o.done, null, { label: "Undo", fn: () => {
      doc = migrate(snap); renderAll(); save(true);
    } });
  };
  if (o.empty) return go();
  ask(o.title, o.body, "Delete").then(yes => { if (yes) go(); });
}

/* Enter makes the next bullet; backspace on an empty one removes it */
pane.addEventListener("keydown", e => {
  const ta = e.target;
  if (!ta.closest || !ta.closest(".bul")) return;
  const bind = ta.dataset.bind;
  if (!bind) return;
  const parts = bind.split("."); const i = +parts.pop();
  const base = parts.join(".");
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    getPath(base).splice(i + 1, 0, "");
    renderEditor(); renderPreview(); save(true);
    focusField(base + "." + (i + 1));
  } else if (e.key === "Backspace" && ta.value === "" && getPath(base).length > 1) {
    e.preventDefault();
    getPath(base).splice(i, 1);
    renderEditor(); renderPreview(); save(true);
    focusField(base + "." + Math.max(0, i - 1));
  }
});

/* ---- design pane ---- */
$("#pane-design").addEventListener("click", e => {
  const t = e.target.closest("[data-tpl]");
  if (t) { doc.design.tpl = t.dataset.tpl; doc.design.tplSet = true; renderDesign(); touch(); return; }
  const f = e.target.closest("[data-face]");
  if (f) { doc.design.face = f.dataset.face; renderDesign(); touch(); return; }
  const a = e.target.closest("[data-accent]");
  if (a) { doc.design.accent = a.dataset.accent; renderDesign(); touch(); return; }
  const s = e.target.closest(".segline button");
  if (s) { doc.design[s.parentElement.dataset.set] = s.dataset.v; renderDesign(); touch(); }
});
$("#pane-design").addEventListener("input", e => {
  const r = e.target.closest("[data-rng]");
  if (!r) return;
  doc.design[r.dataset.rng] = +r.value;
  const b = r.parentElement.querySelector(".top b");
  if (b) b.textContent = r.dataset.rng === "scale" ? r.value + "%"
        : r.dataset.rng === "lead" ? (+r.value / 100).toFixed(2)
        : (+r.value / 96).toFixed(2) + " in";
  touch();
});

/* ---- files pane ---- */
$("#pane-files").addEventListener("click", e => {
  const b = e.target.closest("[data-f]");
  if (b) {
    const a = b.dataset.f, id = b.dataset.id;
    if (a === "menu") {
      e.stopPropagation();
      const m = $('[data-menu="file-' + id + '"]');
      const was = m && m.classList.contains("open");
      $$(".menu.open").forEach(x => x.classList.remove("open"));
      if (m && !was) m.classList.add("open");
      return;
    }
    $$(".menu.open").forEach(x => x.classList.remove("open"));
    if (a === "new") newFile();
    else if (a === "import") openModal("#importScrim");
    else if (a === "dup") duplicateFile(lib.activeId);
    else if (a === "dup2") duplicateFile(id);
    else if (a === "del") deleteFile(id);
    else if (a === "dl-docx" || a === "dl-json") {
      const dl = window.RG && window.RG.download;
      if (dl) dl(a === "dl-docx" ? "docx" : "json");
    }
    return;
  }
  const row = e.target.closest("[data-open]");
  if (row) openFile(row.dataset.open);
});
$("#pane-files").addEventListener("keydown", e => {
  const row = e.target.closest("[data-open]");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openFile(row.dataset.open); }
});

/* ---- tabs, view, zoom ---- */
$$(".tab").forEach(t => t.addEventListener("click", () => {
  $$(".tab").forEach(x => x.setAttribute("aria-selected", String(x === t)));
  $$(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + t.dataset.pane));
  /* the left pane decides what the right pane is for */
  setCanvasMode(t.dataset.pane === "fit" ? "fit" : "paper");
  if (t.dataset.pane === "fit" && RG.renderReport) RG.renderReport();
}));
$$(".mobnav button").forEach(b => b.addEventListener("click", () => {
  $$(".mobnav button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  document.body.dataset.view = b.dataset.view;
  fit();
}));
document.body.dataset.view = "edit";

$("#zoomIn").addEventListener("click", () => setZoom(Math.min(200, Math.round((zoom || curScale()) / 10) * 10 + 10)));
$("#zoomOut").addEventListener("click", () => setZoom(Math.max(40, Math.round((zoom || curScale()) / 10) * 10 - 10)));
$("#zoomVal").addEventListener("click", () => setZoom(0));
function curScale() {
  const paper = PAPER[doc.design.paper] || PAPER.letter;
  return Math.round(Math.min(1, ($("#canvas").clientWidth - 56) / paper.w) * 100);
}
$("#canvas").addEventListener("scroll", () => {
  $("#docTools").classList.toggle("stuck", $("#canvas").scrollTop > 4);
});

/* ---- add section ---- */
function openAdd() {
  $("#addList").innerHTML = Object.keys(TYPES).map(k =>
    '<button class="addopt" data-t="' + k + '"><span class="k">' +
    esc(TYPES[k].name.slice(0, 2).toUpperCase()) + "</span>" +
    '<span class="t"><b>' + esc(TYPES[k].name) + "</b><small>" + esc(TYPES[k].blurb) + "</small></span></button>"
  ).join("");
  openModal("#addScrim");
}
$("#addList").addEventListener("click", e => {
  const b = e.target.closest("[data-t]"); if (!b) return;
  doc.sections.push(newSection(b.dataset.t));
  closeModal("#addScrim");
  renderEditor(); renderPreview(); save(true);
  focusField(firstFieldPath(doc.sections.length - 1));
});

/* ---- modals ---- */
function openModal(sel) {
  if (sel === "#importScrim" && window.RG && window.RG.resetImport) window.RG.resetImport();
  $(sel).classList.add("on");
}
function closeModal(sel) { $(sel).classList.remove("on"); }
$$(".scrim").forEach(s => s.addEventListener("click", e => {
  if (e.target === s || e.target.closest("[data-close]")) s.classList.remove("on");
}));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $$(".scrim.on").forEach(s => s.classList.remove("on")); $$(".menu.open").forEach(m => m.classList.remove("open")); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(true); }
});

function ask(title, body, okLabel) {
  return new Promise(resolve => {
    const scrim = $("#askScrim"), ok = $("#askOk");
    $("#askTitle").textContent = title;
    $("#askBody").textContent = body;
    ok.textContent = okLabel || "Delete";
    const done = v => {
      scrim.classList.remove("on");
      ok.removeEventListener("click", yes);
      scrim.removeEventListener("click", no);
      document.removeEventListener("keydown", key);
      resolve(v);
    };
    const yes = () => done(true);
    const no = ev => { if (ev.target === scrim || ev.target.closest("[data-close]")) done(false); };
    const key = ev => { if (ev.key === "Escape") done(false); };
    ok.addEventListener("click", yes);
    scrim.addEventListener("click", no);
    document.addEventListener("keydown", key);
    scrim.classList.add("on");
    setTimeout(() => ok.focus(), 30);
  });
}

/* ---- appearance: follow the system, or pin it ---- */
function applyTheme() {
  const t = lib.theme || "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  const m = $("#menuTheme");
  if (m) {
    m.innerHTML = [["auto", "Match system"], ["light", "Light"], ["dark", "Dark"]]
      .map(o => '<button data-theme="' + o[0] + '">' + o[1] +
        (t === o[0] ? '<small style="color:var(--accent)">' + ICON.check + "</small>" : "") + "</button>").join("");
  }
}
$("#btnTheme").addEventListener("click", e => {
  e.stopPropagation();
  const m = $("#menuTheme"), was = m.classList.contains("open");
  $$(".menu.open").forEach(x => x.classList.remove("open"));
  if (!was) m.classList.add("open");
});
$("#menuTheme").addEventListener("click", e => {
  const b = e.target.closest("[data-theme]"); if (!b) return;
  lib.theme = b.dataset.theme;
  applyTheme(); save(true);
  $("#menuTheme").classList.remove("open");
});

$("#btnExport").addEventListener("click", e => {
  e.stopPropagation();
  const m = $("#menuExport"), was = m.classList.contains("open");
  $$(".menu.open").forEach(x => x.classList.remove("open"));
  if (!was) m.classList.add("open");
});
document.addEventListener("click", () => $$(".menu.open").forEach(m => m.classList.remove("open")));
$("#btnImport").addEventListener("click", () => openModal("#importScrim"));

let rt = null;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(fit, 90); });

/* ---- boot ---- */
window.RG = {
  get doc() { return doc; },
  set doc(d) { doc = d; },
  renderEditor, renderPreview, renderFiles, renderDesign, renderAll,
  syncDesignUI: renderDesign, save, blankDoc, starterDoc, migrate,
  TYPES, uid, openModal, closeModal, $, $$, esc, ask, fmtDate, fmtRange,
  newFile, setActiveName, activeEntry, firstVisit, flashSaved,
  setCanvasMode, libRef: () => lib
};
applyTheme();
renderAll();
save(true);

})();
</script>
