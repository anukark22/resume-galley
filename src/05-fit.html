
<script>
/* ============================================================================
   Job Match - talks only to this app's own /api/analyze-job route.
   The browser never sees the Ollama address or the model name; the server
   route holds OLLAMA_BASE_URL and OLLAMA_MODEL.
   ========================================================================== */
(function () {
"use strict";

const RG = window.RG;
const { $, $$, esc } = RG;

const STEPS = ["Comparing requirements", "Checking experience",
               "Evaluating technical fit", "Preparing verdict"];
let running = null, busy = false, stepTimer = null, stepIx = 0;

function fitState() {
  const d = RG.doc;
  if (!d.fit) d.fit = { jd: "", result: null, at: 0, error: "", secs: 0 };
  return d.fit;
}
/* the API route is only there when a server is: not on file://, and not
   inside the published artifact, whose sandbox blocks outside requests */
function apiAvailable() {
  if (location.protocol === "file:") return false;
  if (window.claude && window.claude.use) return false;
  return true;
}

/* ------------------------------------------------------------- the call -- */
async function analyse(onProgress) {
  const f = fitState();
  const resume = RG.io.buildTxt().trim();
  running = new AbortController();

  let res;
  try {
    res = await fetch("/api/analyze-job", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ resume: resume, jobDescription: f.jd || "" }),
      signal: running.signal
    });
  } catch (err) {
    running = null;
    if (err && err.name === "AbortError") throw err;
    throw new Error("Resume Galley couldn't reach the analysis service. " +
                    "Check that the app is being served (not opened as a file).");
  }

  if (!res.ok && !/ndjson/.test(res.headers.get("content-type") || "")) {
    let msg = "The analysis service answered " + res.status + ".";
    try { const j = await res.json(); if (j && j.error) msg = j.error; } catch (e) {}
    running = null;
    throw new Error(msg);
  }

  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", out = null, failure = null;
  try {
    for (;;) {
      const chunk = await reader.read();
      if (chunk.done) break;
      buf += dec.decode(chunk.value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t) continue;
        let j; try { j = JSON.parse(t); } catch (e) { continue; }
        if (j.type === "progress" && onProgress) onProgress(j.chars);
        else if (j.type === "result") out = j.data;
        else if (j.type === "error") failure = j.message || "Analysis failed.";
      }
    }
  } finally { running = null; }

  if (failure) throw new Error(failure);
  if (!out) throw new Error("The analysis ended without returning a result. Try again.");
  return out;
}
function stop() { if (running) { running.abort(); running = null; } }

/* ============================================================ the panel == */
function renderFit() {
  const pane = $("#pane-fit");
  if (!pane) return;
  const f = fitState();
  const name = (RG.doc.header.name || "").trim() || RG.activeEntry().name || "Untitled resume";

  let h = "";
  h += '<section class="group jm-intro">' +
    "<h2>How well do you match this job?</h2>" +
    "<p>Compare your resume against the actual requirements of the role.</p></section>";

  h += '<section class="group"><div class="jm-resume">' +
    "<b>" + esc(name) + "</b><small>Current resume</small></div></section>";

  if (!apiAvailable()) {
    h += '<div class="frow2 bad"><span class="m"><b>Not available on this copy</b>' +
      "<small>Job Match runs through this app's own server route. Open the deployed site, " +
      "or run <code>node src/server.js</code> locally - a page opened straight from a file " +
      "has no server to call.</small></span></div>";
  }

  h += '<section class="group"><h3>Job description</h3>' +
    '<textarea class="paste" id="jdBox" style="min-height:210px" placeholder="Paste the job description here...">' +
    esc(f.jd || "") + "</textarea></section>";

  h += '<div class="addrow">' +
    (busy
      ? '<button class="btn outline" id="fitStop" style="flex:1;justify-content:center">Stop</button>'
      : '<button class="btn primary" id="fitRun" style="flex:1;justify-content:center"' +
        (apiAvailable() ? "" : " disabled") + ">Analyze my fit</button>") +
    (!busy && (f.jd || f.result) ? '<button class="btn outline" id="fitClear">Clear</button>' : "") +
  "</div>";

  if (f.error) {
    h += '<div class="jm-err"><b>AI analysis unavailable</b><p>' + esc(f.error) + "</p>" +
      '<button class="btn outline sm" id="fitRetry">Try again</button></div>';
  }
  if (f.result && !f.error) {
    h += '<p class="hint">Analysed ' + esc(new Date(f.at).toLocaleString()) +
      (f.secs ? " · took " + esc(f.secs) + "s" : "") +
      ". Kept only in this browser, with this resume.</p>";
  }
  pane.innerHTML = h;
}

/* ============================================================ the report = */
const STAT = { MATCH: "ok", PARTIAL: "warn", MISSING: "bad", UNCLEAR: "idle" };
const BAND = s => (s >= 80 ? "ok" : s >= 60 ? "warn" : "bad");
const LABEL = s => (s >= 90 ? "Exceptional match" : s >= 80 ? "Strong match"
  : s >= 70 ? "Good match" : s >= 60 ? "Borderline match"
  : s >= 40 ? "Weak match" : "Poor match");

function reportHTML(r) {
  const band = BAND(r.fit_score);
  const sec = (t, b) => (b ? '<section class="rep-sec"><h3>' + t + "</h3>" + b + "</section>" : "");
  let h = '<div class="rep">';

  h += '<header class="rep-head"><div class="rep-score ' + band + '">' +
    "<b>" + r.fit_score + "</b><span>out of 100</span></div>" +
    '<div class="rep-lead"><div class="rep-band ' + band + '">' + LABEL(r.fit_score) + "</div>" +
    '<p class="verdict">' + esc(r.one_line_verdict || "No verdict returned.") + "</p></div></header>";

  if (r.summary) h += '<p class="rep-summary">' + esc(r.summary) + "</p>";

  if (r.requirements.length) {
    h += sec("Requirement breakdown", '<div class="reqlist">' + r.requirements.map(q =>
      '<div class="req"><span class="reqdot ' + (STAT[q.status] || "idle") + '"></span>' +
      '<div class="reqmain"><b>' + esc(q.requirement) + "</b>" +
      (q.evidence ? "<small>" + esc(q.evidence) + "</small>" : "") + "</div>" +
      '<span class="reqtag">' + esc(q.importance) + "</span>" +
      '<span class="reqstat ' + (STAT[q.status] || "idle") + '">' + esc(q.status) + "</span></div>"
    ).join("") + "</div>");
  }

  if (r.strengths.length) {
    h += sec("Where you match", '<div class="cardlist">' + r.strengths.map(s =>
      '<div class="repcard"><b>' + esc(s.title) + "</b>" +
      (s.explanation ? "<p>" + esc(s.explanation) + "</p>" : "") +
      (s.evidence ? "<q>" + esc(s.evidence) + "</q>" : "") + "</div>").join("") + "</div>");
  }

  if (r.gaps.length) {
    const kind = sv => (sv === "HIGH" ? "Required gap" : sv === "MEDIUM" ? "Preferred gap" : "Minor gap");
    h += sec("Where you fall short", '<div class="cardlist">' + r.gaps.map(g =>
      '<div class="repcard"><div class="cardtop"><b>' + esc(g.title) + "</b>" +
      '<span class="repchip ' + (g.severity === "HIGH" ? "bad" : g.severity === "MEDIUM" ? "warn" : "idle") +
      '">' + kind(g.severity) + "</span></div>" +
      (g.explanation ? "<p>" + esc(g.explanation) + "</p>" : "") +
      (g.job_requirement ? "<q>" + esc(g.job_requirement) + "</q>" : "") + "</div>").join("") + "</div>");
  }

  h += sec("Would I interview you?",
    '<div class="jm-verdict"><span class="repchip ' +
    (/^VERY LIKELY|^LIKELY/.test(r.interview_likelihood) ? "ok"
      : r.interview_likelihood === "POSSIBLE" ? "warn" : "bad") + '">' +
    esc(r.interview_likelihood) + "</span>" +
    '<span class="repchip ' + band + '">' + esc(r.application_recommendation) + "</span></div>" +
    (r.summary ? "" : ""));

  if (r.improvements.length) {
    const order = { HIGH: 0, MEDIUM: 1, LOW: 2 };
    const list = r.improvements.slice().sort((a, b) => order[a.priority] - order[b.priority]);
    h += sec("What would improve your chances?", '<div class="cardlist">' + list.map(i =>
      '<div class="repcard"><div class="cardtop"><b>' + esc(i.recommendation) + "</b>" +
      '<span class="repchip ' + (i.priority === "HIGH" ? "bad" : i.priority === "MEDIUM" ? "warn" : "idle") +
      '">' + esc(i.priority) + " IMPACT</span></div>" +
      (i.reason ? "<p>" + esc(i.reason) + "</p>" : "") + "</div>").join("") + "</div>");
  }

  const k = r.keyword_analysis;
  if (k.present.length || k.related_wording.length || k.missing.length) {
    const col = (t, list, cls) => (list.length
      ? "<div><h4>" + t + "</h4><div class=\"kws\">" +
        list.map(x => '<span class="kw ' + cls + '">' + esc(x) + "</span>").join("") + "</div></div>"
      : "");
    h += sec("Keywords", '<div class="kwcols">' +
      col("Present", k.present, "ok") + col("Different wording", k.related_wording, "warn") +
      col("Missing", k.missing, "bad") + "</div>");
  }
  if (r.resume_communication_issues.length) {
    h += sec("How the resume reads", '<ul class="replist">' +
      r.resume_communication_issues.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>");
  }

  h += '<p class="rep-foot">Analysed by a model running on your own machine. ' +
    "A model's judgement is not a recruiter's - treat it as a second opinion.</p>";
  return h + "</div>";
}

function renderReport() {
  const host = $("#report");
  if (!host) return;
  const f = fitState();
  if (busy) {
    host.innerHTML = '<div class="rep-wait"><b>Analyzing your fit' + String.fromCharCode(8230) + "</b>" +
      '<span id="fitStep">' + STEPS[0] + "</span>" +
      '<span class="jm-prog" id="fitProg"></span></div>';
    return;
  }
  if (f.result && !f.error) { host.innerHTML = reportHTML(f.result); return; }
  host.innerHTML = '<div class="rep-wait"><b>No analysis yet</b>' +
    "<span>Paste a job description and press Analyze my fit.</span></div>";
}

function startSteps() {
  stepIx = 0;
  clearInterval(stepTimer);
  stepTimer = setInterval(() => {
    stepIx = (stepIx + 1) % STEPS.length;
    const el = $("#fitStep");
    if (el) el.textContent = STEPS[stepIx];
  }, 4000);
}
function stopSteps() { clearInterval(stepTimer); stepTimer = null; }

/* ============================================================== wiring === */
async function run() {
  const f = fitState();
  if (!(f.jd || "").trim()) {
    f.error = "Paste the job description first.";
    renderFit(); return;
  }
  f.error = "";
  busy = true;
  const started = Date.now();
  renderFit(); RG.setCanvasMode("fit"); renderReport(); startSteps();
  try {
    const res = await analyse(chars => {
      const p = $("#fitProg");
      if (p) p.textContent = chars.toLocaleString() + " characters";
    });
    f.result = res; f.at = Date.now(); f.error = "";
    f.secs = Math.round((Date.now() - started) / 1000);
  } catch (err) {
    f.result = null;
    f.error = (err && err.name === "AbortError") ? "Stopped."
      : (err && err.message ? err.message : String(err));
  }
  running = null;
  busy = false;
  stopSteps();
  RG.save(true); renderFit(); renderReport();
}

document.addEventListener("click", e => {
  const t = e.target;
  if (!t.closest) return;
  if (t.closest("#fitRun") || t.closest("#fitRetry")) { run(); return; }
  if (t.closest("#fitStop")) { stop(); return; }
  if (t.closest("#fitClear")) {
    const f = fitState();
    f.result = null; f.error = ""; f.at = 0; f.jd = "";
    RG.save(true); renderFit(); renderReport();
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "jdBox") { fitState().jd = e.target.value; RG.save(); }
});

RG.renderFit = renderFit;
RG.renderReport = renderReport;
RG.fitBusy = () => busy;

/* core booted before this module existed, so draw our own panes now */
renderFit();
renderReport();

})();
</script>
